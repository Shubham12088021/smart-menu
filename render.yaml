# Render Blueprint — one-click deployment
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: smart-menu-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-menu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel URL after deploying frontend
      - key: PYTHON_VERSION
        value: "3.10.0"

databases:
  # ── PostgreSQL Database ────────────────────────────────────────
  - name: smart-menu-db
    plan: free
    region: oregon
